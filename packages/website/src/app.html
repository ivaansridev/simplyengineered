<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /*
       * Restore the saved ColorSwitcher choice before first paint so the page
       * never flashes the default accent. Only --spe-accent is touched.
       *
       * Keep this mapping in sync with ColorSwitcher.svelte (resolve()): a
       * literal color passes through, a name becomes var(--spe-color-<name>).
       */
      (function () {
        try {
          var name = localStorage.getItem('spe-colorswitcher');
          if (!name) return;
          var literal = /^(#|rgb|hsl|oklch|lab|color)/i.test(name);
          document.documentElement.style.setProperty(
            '--spe-accent',
            literal ? name : 'var(--spe-color-' + name + ')'
          );
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
